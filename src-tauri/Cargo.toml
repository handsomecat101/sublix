[package]
name = "sublix"
version = "0.1.0"
description = "Sublix - Real-time subtitle overlay for any video"
authors = ["Anh Tuấn"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sublix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri framework
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# === M1: Audio capture ===
wasapi = "0.20"                              # Windows Core Audio API bindings (loopback capture)
hound = "3.5"                                # WAV file writer (debug/testing)
anyhow = "1"                                 # Application error handling
thiserror = "1"                              # Typed error definitions
tracing = "0.1"                              # Structured logging
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# === M2: Speech-to-Text (local whisper.cpp via subprocess — no LLVM, no API) ===
# Uses prebuilt whisper.cpp Windows binary (downloaded on first run, ~30MB).
# Model: ggml-tiny.bin (~75MB) for fast MVP, can upgrade to large-v3 (~3GB) later.
# Cloud OpenAI API remains as opt-in for users who want better quality.
reqwest = { version = "0.12", features = ["blocking", "stream"] }  # Download binary + model
zip = { version = "2", default-features = false, features = ["deflate"] }  # Extract whisper.cpp release zip
tokio = { version = "1", features = ["fs", "rt-multi-thread"] }

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# When enabled, the binary keeps the console window (useful for CLI testing)
default = []
cli = []
