[package]
name = "sublix"
version = "0.11.5"
description = "Sublix - Real-time subtitle overlay for any video"
authors = ["Anh TuÃ¡ÂºÂ¥n"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sublix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri framework
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
base64 = "0.22"

# === M1: Audio capture ===
wasapi = "0.20"                              # Windows Core Audio API bindings (loopback capture)
hound = "3.5"                                # WAV file writer (debug/testing)
anyhow = "1"                                 # Application error handling
thiserror = "1"                              # Typed error definitions
tracing = "0.1"                              # Structured logging
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# === M2: Speech-to-Text (local whisper.cpp via subprocess Ã¢â‚¬â€ no LLVM, no API) ===
# Uses prebuilt whisper.cpp Windows binary (downloaded on first run, ~30MB).
# Model: ggml-tiny.bin (~75MB) for fast MVP, can upgrade to large-v3 (~3GB) later.
# Cloud OpenAI API remains as opt-in for users who want better quality.
reqwest = { version = "0.12", features = ["blocking", "stream", "json", "multipart"] }  # Download binary + model + JSON for llama-server HTTP + multipart for whisper-server
zip = { version = "2", default-features = false, features = ["deflate"] }  # Extract whisper.cpp release zip
url = "2"  # BUG-058: parse URL host for accurate platform matching
tokio = { version = "1", features = ["fs", "rt-multi-thread"] }

# === M4: Overlay UI Ã¢â‚¬â€ Win32 API for click-through + always-on-top ===
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",           # v0.9.4: ShellExecuteW / SHOpenFolderAndSelectItems
    "Win32_UI_Shell_Common",    # v0.9.4: ITEMIDLIST used by the shell select API
    "Win32_System_Com",         # v0.9.4: COM types referenced by the shell bindings
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem", # BUG-051: GetDiskFreeSpaceExW for disk-space check
    # R2-08.1: Windows Job Object with KILL_ON_JOB_CLOSE so killing/ crashing
    # the app drags every yt-dlp/ffmpeg grandchild down with it (no zombies).
    "Win32_Security",           # required for SECURITY_ATTRIBUTES on CreateJobObjectW
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# === M2.5: Live capture Ã¢â€ â€™ STT Ã¢â€ â€™ overlay (real-time) ===
crossbeam-channel = "0.5"  # For stop signal + chunk queue

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# When enabled, the binary keeps the console window (useful for CLI testing)
default = []
cli = []
